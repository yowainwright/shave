name: Update dependencies

on:
  schedule:
    - cron: "0 9 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: dependency-updates
  cancel-in-progress: false

jobs:
  codependence:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Update package dependencies
        uses: yowainwright/codependence@58d3c029ea39bc30b8ca9f1262ac3f4d2cb189d1 # v1.0.16
        with:
          targets: pnpm
          pull-request: true
          token: ${{ secrets.CODEPENDENCE_TOKEN }}
          post-update-command: pnpm install --no-frozen-lockfile --lockfile-only --ignore-scripts

  pastoralist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Update dependency overrides
        uses: yowainwright/pastoralist@bdc2ec5ae8f68536a8589c756f5691d7bba4add4 # v1.14.0
        with:
          mode: pr
          check-security: true
          fail-on-security: true
          github-token: ${{ secrets.CODEPENDENCE_TOKEN }}
